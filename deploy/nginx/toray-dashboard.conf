location /api/ {
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in;

    auth_request_set $email $upstream_http_x_auth_request_email;
    proxy_set_header X-Auth-Request-Email $email;

    proxy_pass http://localhost:8000; # Assuming backend runs on 8000
}

location / {
    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in;
    
    proxy_pass http://localhost:5173; # Assuming frontend dev server or static files
}
